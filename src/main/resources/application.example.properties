server.port=8080

# 数据库配置：请将下面的用户名/密码改为你本机的 MySQL 配置，并确保已创建 onehour_job 库
spring.datasource.url=jdbc:mysql://localhost:3306/onehour_job?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=替换为你的MySQL密码
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 通义千问（DashScope）配置：请替换为你自己的 API-Key，申请地址 https://dashscope.console.aliyun.com/
langchain4j.dashscope.api-key=替换为你的DashScope_API_KEY
langchain4j.dashscope.chat.model-name=qwen-max
langchain4j.dashscope.embedding.model-name=text-embedding-v2

# JWT 密钥：请替换为自定义随机字符串
jwt.secret=替换为你的JWT密钥

# 文件上传配置
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
upload.path=uploads

# Dify AI 工作流配置：请替换为你的 Dify 应用 API-Key
dify.api-url=http://127.0.0.1/v1/workflows/run
dify.api-key=替换为你的Dify_API_KEY
